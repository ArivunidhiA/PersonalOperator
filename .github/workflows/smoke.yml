name: Smoke

# Hourly production smoke (links, headers, old endpoints 404, /call render).
# Uses Actions minutes; when they run out this stops. See docs/ops/uptime.md.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      # Lightpanda nightly. If the download or start fails the script still runs
      # with plain fetch checks (no CDP render), so the job never depends on it.
      - name: Start Lightpanda (best effort)
        id: lp
        continue-on-error: true
        run: |
          curl -fsSL -o lightpanda https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux
          chmod +x lightpanda
          ./lightpanda serve --host 127.0.0.1 --port 9222 > lightpanda.log 2>&1 &
          for i in $(seq 1 20); do
            (echo > /dev/tcp/127.0.0.1/9222) 2>/dev/null && echo "ready" && exit 0
            sleep 1
          done
          echo "Lightpanda did not start"; cat lightpanda.log; exit 1

      - name: Smoke
        run: node scripts/smoke-lightpanda.mjs
        env:
          SMOKE_BASE_URL: https://www.arivsai.app
          CDP_URL: ${{ steps.lp.outcome == 'success' && 'ws://127.0.0.1:9222' || '' }}
