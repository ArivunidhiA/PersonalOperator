name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - uses: actions/setup-node@v4
        with:
          # Same major as the Vercel project (Node 24.x).
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + route tests
        run: npm test
        env:
          # Lets the confidential-name test run without putting the names in the repo.
          BANNED_TERMS: ${{ secrets.BANNED_TERMS }}

      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
