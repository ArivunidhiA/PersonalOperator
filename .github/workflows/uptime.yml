name: Uptime

# Needs Actions minutes: when the account's minutes run out this stops running
# silently. docs/ops/uptime.md has an external-monitor alternative.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check /api/health
        run: |
          set -u
          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 https://www.arivsai.app/api/health || echo 000)
          echo "HTTP $code"; cat body.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::error title=arivsai.app unhealthy::/api/health returned $code"
            exit 1
          fi
