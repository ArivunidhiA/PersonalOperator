<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c2f39"/>
    </marker>
    <style>
      .box{fill:#141210;stroke:#3a3431;stroke-width:1.2;rx:14}
      .hot{stroke:#8c2f39;stroke-width:1.6}
      .t{fill:#f3ede4;font-size:17px;font-weight:600}
      .s{fill:#a39a90;font-size:13px}
      .l{fill:#8c2f39;font-size:12px;font-weight:600;letter-spacing:.6px}
      .arrow{stroke:#8c2f39;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .thin{stroke:#5a524c;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="960" height="520" fill="#0b0a09"/>

  <!-- Browser -->
  <rect class="box hot" x="40" y="150" width="230" height="200"/>
  <circle cx="155" cy="215" r="34" fill="none" stroke="#f3ede4" stroke-width="1.5" opacity=".85"/>
  <circle cx="155" cy="215" r="34" fill="none" stroke="#8c2f39" stroke-width="3" stroke-dasharray="80 140" opacity=".9"/>
  <text class="t" x="155" y="285" text-anchor="middle">Your browser</text>
  <text class="s" x="155" y="306" text-anchor="middle">tap the orb, talk into the mic</text>
  <text class="s" x="155" y="324" text-anchor="middle">audio goes straight to Gemini</text>

  <!-- Gemini -->
  <rect class="box hot" x="690" y="60" width="230" height="130"/>
  <text class="l" x="805" y="92" text-anchor="middle">VOICE MODEL</text>
  <text class="t" x="805" y="122" text-anchor="middle">Gemini Live</text>
  <text class="s" x="805" y="145" text-anchor="middle">speech in, speech out, free tier</text>
  <text class="s" x="805" y="165" text-anchor="middle">prompt + tools locked server-side</text>

  <!-- Server -->
  <rect class="box hot" x="365" y="150" width="230" height="200"/>
  <text class="l" x="480" y="182" text-anchor="middle">THE SMALL SERVER</text>
  <text class="t" x="480" y="212" text-anchor="middle">Next.js on Vercel</text>
  <text class="s" x="480" y="240" text-anchor="middle">starts a call, hands out a one-use token</text>
  <text class="s" x="480" y="260" text-anchor="middle">runs the tools the model asks for</text>
  <text class="s" x="480" y="280" text-anchor="middle">checks every line it said afterwards</text>
  <text class="s" x="480" y="300" text-anchor="middle">saves the call, emails me a recap</text>
  <text class="s" x="480" y="330" text-anchor="middle" fill="#8c2f39">no model ever sees your email or name</text>

  <!-- Services row -->
  <rect class="box" x="40" y="420" width="160" height="70"/>
  <text class="t" x="120" y="450" text-anchor="middle">Supabase</text>
  <text class="s" x="120" y="470" text-anchor="middle">transcripts, visits</text>

  <rect class="box" x="230" y="420" width="160" height="70"/>
  <text class="t" x="310" y="450" text-anchor="middle">Upstash</text>
  <text class="s" x="310" y="470" text-anchor="middle">rate limits, locks</text>

  <rect class="box" x="420" y="420" width="160" height="70"/>
  <text class="t" x="500" y="450" text-anchor="middle">Calendly</text>
  <text class="s" x="500" y="470" text-anchor="middle">open 15-min slots</text>

  <rect class="box" x="610" y="420" width="160" height="70"/>
  <text class="t" x="690" y="450" text-anchor="middle">Resend</text>
  <text class="s" x="690" y="470" text-anchor="middle">the recap email</text>

  <rect class="box" x="800" y="420" width="120" height="70"/>
  <text class="t" x="860" y="450" text-anchor="middle">Turnstile</text>
  <text class="s" x="860" y="470" text-anchor="middle">bot check</text>

  <!-- Arrows -->
  <path class="arrow" d="M270 220 H365"/>
  <text class="s" x="317" y="208" text-anchor="middle">1. start</text>
  <path class="arrow" d="M270 200 C 420 60, 560 60, 690 110"/>
  <text class="s" x="470" y="80" text-anchor="middle">2. live audio both ways</text>
  <path class="arrow" d="M690 150 C 650 230, 640 250, 595 250"/>
  <text class="s" x="665" y="265" text-anchor="middle">3. "look up his calendar"</text>
  <path class="arrow" d="M365 320 C 300 380, 200 380, 155 420"/>
  <text class="s" x="230" y="372" text-anchor="middle">4. after the call</text>
  <path class="thin" d="M480 350 V420"/>
  <path class="thin" d="M520 350 C 560 390, 640 400, 690 420"/>
  <path class="thin" d="M560 350 C 700 380, 820 390, 860 420"/>
  <path class="thin" d="M440 350 C 400 380, 340 395, 310 420"/>
</svg>
