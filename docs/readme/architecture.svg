<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .n{fill:#8c8178;font-size:18px;font-weight:600;text-anchor:middle}
      .m{fill:#8c8178;font-size:12px;text-anchor:middle;opacity:.75}
      .line{stroke:#8c2f39;stroke-width:1.6}
      .dot{fill:#8c2f39}
    </style>
  </defs>

  <!-- orb -->
  <circle cx="110" cy="62" r="30" fill="none" stroke="#8c8178" stroke-width="1.4" opacity=".8"/>
  <circle cx="110" cy="62" r="30" fill="none" stroke="#8c2f39" stroke-width="3" stroke-dasharray="75 120" transform="rotate(-40 110 62)"/>

  <!-- spine -->
  <line class="line" x1="150" y1="62" x2="1090" y2="62"/>
  <circle class="dot" cx="355" cy="62" r="4"/>
  <circle class="dot" cx="600" cy="62" r="4"/>
  <circle class="dot" cx="845" cy="62" r="4"/>
  <circle class="dot" cx="1090" cy="62" r="4"/>

  <text class="n" x="110" y="124">you</text>
  <text class="m" x="110" y="144">talk</text>

  <text class="n" x="355" y="124">Gemini Live</text>
  <text class="m" x="355" y="144">speaks back</text>

  <text class="n" x="600" y="124">a small server</text>
  <text class="m" x="600" y="144">facts · calendar · fact-check</text>

  <text class="n" x="845" y="124">Supabase</text>
  <text class="m" x="845" y="144">the transcript</text>

  <text class="n" x="1090" y="124">me</text>
  <text class="m" x="1090" y="144">a recap email</text>
</svg>
